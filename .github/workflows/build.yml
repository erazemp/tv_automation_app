name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv_automation_app/tv_automation_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: StreamTest-apk, path: tv_automation_app/tv_automation_app/app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish APK to 'apk' branch
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/StreamTest.apk
          cd /tmp/out && git init -q && git checkout -q -b apk
          git config user.name ci && git config user.email ci@users.noreply.github.com
          echo "${GITHUB_SHA}" > COMMIT && git add . && git commit -qm "APK for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
